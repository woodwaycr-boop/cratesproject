# CrateCore configuration
# Names use MiniMessage format: https://docs.advntr.dev/minimessage/format.html
#
# Each reward's "chance" is a relative weight, not a percentage. The preview menu shows each
# weight as a percentage of the crate's total. A reward can give any mix of:
#   money:    amount paid through Vault
#   items:    list of "MATERIAL:amount", for example "DIAMOND:8"
#   commands: run by the console, %player% is replaced with the winner's name
#             (use these for enchanted items, ranks, permissions, other plugins)
# Other options per reward:
#   display-name, icon (menu item)
#   broadcast:  true = announce the win to the whole server
#   great-win:  true/false = force or forbid the fireworks celebration. If you leave it out,
#               a reward counts as a great win when its chance is at or below
#               animation.great-win-chance-percent (below).
#
# Amounts below are placeholders. Tune them against your server's economy.
# The preview menu fits 28 rewards per crate.

# The opening animation. All of these are optional: anything you delete falls back to a built-in default.
animation:
  # false = open instantly with no reel.
  enabled: true
  # How many times the reel moves before it stops. More = a longer spin.
  steps: 40
  # The reel starts fast (1 tick per move) and slows down to this many ticks per move. 20 ticks = 1 second.
  max-delay-ticks: 9
  # How long the menu stays open on the winning reward, in ticks.
  celebration-ticks: 40
  # Rewards at or below this chance (in percent) are "great wins": fireworks, extra sounds, special title.
  great-win-chance-percent: 5
  # How many fireworks a great win launches. They are decoration only and deal no damage.
  great-win-fireworks: 8
  # Sound ids. Vanilla names work, and so do sounds from a resource pack. Leave one empty ("") to silence it.
  sounds:
    start: "minecraft:block.ender_chest.open"
    tick: "minecraft:block.note_block.hat"
    win: "minecraft:entity.player.levelup"
    great-win: "minecraft:ui.toast.challenge_complete"
    great-win-note: "minecraft:block.note_block.bell"
    no-key: "minecraft:entity.villager.no"

