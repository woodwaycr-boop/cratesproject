  crate-protected: "<red>You can't break a crate. Admins: use /crate remove."
  crate-set: "<green>That block is now a <crate>."
  crate-removed: "<green>Crate removed."
  not-a-crate: "<red>That block isn't a crate."
  already-crate: "<red>That block is already a crate."
  look-at-block: "<red>Look at a block within 5 blocks first."
  unknown-crate: "<red>Unknown crate. Available: <list>"
