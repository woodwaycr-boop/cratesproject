        icon: GOLD_INGOT
        money: 1000
      diamonds:
        chance: 30
        display-name: "<aqua>12 Diamonds"
        icon: DIAMOND
        items:
          - "DIAMOND:12"
      golden-apples:
        chance: 20
        display-name: "<gold>8 Golden Apples"
        icon: GOLDEN_APPLE
        items:
          - "GOLDEN_APPLE:8"
      emeralds:
        chance: 12
